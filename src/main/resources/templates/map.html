<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP Location Lookup — Spring Boot + GeoLite2</title>
  <style>
    body { font: 17px/1.6 system-ui, sans-serif; background: #f4f6fa; color: #182438; margin: 0; }
    main { max-width: 680px; margin: 8vh auto; padding: 28px; background: white; border-radius: 18px; }
    h1 { line-height: 1.2; } input, button { font: inherit; padding: 12px; border-radius: 8px; }
    input { border: 1px solid #9aa6b5; width: min(100%, 320px); box-sizing: border-box; }
    button { background: #194bd5; color: white; border: 0; cursor: pointer; }
    #result { white-space: pre-wrap; } a { color: #194bd5; }
  </style>
</head>
<body>
<main>
  <h1>IP Location Lookup</h1>
  <p>Look up approximate coordinates from your local MaxMind City database. IP location is not GPS or a person's exact address.</p>
  <form id="lookup">
    <label for="ip">IPv4 or IPv6 address</label><br>
    <input id="ip" name="ip" type="text" placeholder="Enter a public IP address" maxlength="45" required>
    <button type="submit">Look up</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <a id="map" hidden target="_blank" rel="noopener noreferrer">Open approximate location in OpenStreetMap</a>
  <p><small>Lookups stay in this app. Opening the map sends the displayed coordinates to OpenStreetMap.</small></p>
</main>
<script>
const form = document.getElementById('lookup');
const result = document.getElementById('result');
const map = document.getElementById('map');
form.addEventListener('submit', async (event) => {
  event.preventDefault(); map.hidden = true; result.textContent = 'Looking up…';
  try {
    const response = await fetch('/loc?ip=' + encodeURIComponent(document.getElementById('ip').value.trim()));
    const data = await response.json();
    if (!response.ok) {
      result.textContent = data.message || 'Lookup failed (HTTP ' + response.status + ').'; return;
    }
    const lat = Number(data.latitude), lon = Number(data.longitude);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('Missing coordinates');
    result.textContent = 'Approximate latitude: ' + lat + '\nApproximate longitude: ' + lon;
    map.href = 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon + '#map=7/' + lat + '/' + lon;
    map.hidden = false;
  } catch (error) { result.textContent = 'Could not read the lookup response. Check that the app is running.'; }
});
</script>
</body>
</html>
